[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tesseract"
version = "0.1.0"
description = "A lightweight, feature rich Minecraft launcher"
readme = "README.md"
license = "LGPL-3.0-only"
requires-python = ">=3.14"
authors = [{ name = "Austin Colt" }]
keywords = ["minecraft", "launcher", "qt", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "platformdirs>=4",
    "PySide6>=6.9,<7",
    "structlog>=25",
]

# A dependency group, and not an optional dependency. "uv sync" installs a group
# by default, so a new contributor gets the test tools with one command.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "basedpyright>=1.39",
]

[project.scripts]
tesseract = "tesseract.main:main"

[project.urls]
Homepage = "https://forge.coltco.net/austin/tesseract"

# The build backend reads the "src" layout. It puts every file under
# src/tesseract into the wheel, which includes the stylesheets.
[tool.uv.build-backend]
module-name = "tesseract"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src", "tests"]
# The editor starts the language server outside "uv run", so the server must
# be told where the environment of the project is. Without these two lines it
# reads the Python of the system and it resolves no dependency.
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
# The same strictness as the default of pyright. Raise this to "strict" when the
# core is complete, and repair what it then reports.
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "warning"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that reach the network are opt-in. Run them with: pytest -m network
markers = ["network: needs the internet"]
addopts = "-m 'not network'"
